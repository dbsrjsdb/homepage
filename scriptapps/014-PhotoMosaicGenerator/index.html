<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Reconstruct an image from colored tiles or emoji locally in your browser."><title>PhotoMosaicGenerator | Build tile art</title><link rel="stylesheet" href="styles.css"></head><body><main class="page-shell"><header class="hero"><p class="eyebrow">A picture, tile by tile</p><h1>Photo<span>MosaicGenerator</span></h1><p class="intro">Turn an image into a colorful mosaic of tiles or emoji, with every pixel processed locally.</p></header><div class="workspace"><section class="panel controls-panel" aria-labelledby="controls-heading"><h2 id="controls-heading">Mosaic settings</h2><label class="drop-zone" id="drop-zone" for="file-input"><span class="drop-title">Drop an image here</span><span class="drop-help">or choose a file to begin</span><span class="browse-button">Browse image</span><input id="file-input" type="file" accept="image/*"></label><label for="columns-input">Tile columns <output id="columns-value" for="columns-input">48</output></label><input id="columns-input" type="range" min="12" max="100" value="48"><label for="mode-input">Tile style</label><select id="mode-input"><option value="color">Average color</option><option value="emoji">Emoji</option></select><div id="emoji-row" hidden><label for="emoji-input">Emoji</label><input id="emoji-input" class="text-input" type="text" maxlength="4" value="🟠"></div><label for="gap-input">Tile gap <output id="gap-value" for="gap-input">1 px</output></label><input id="gap-input" type="range" min="0" max="5" value="1"><div class="actions"><button id="download-button" type="button" disabled>Download PNG</button><button id="reset-button" class="secondary-button" type="button" disabled>Reset</button></div><p class="status" id="status" role="status" aria-live="polite">Choose an image to begin.</p></section><section class="panel preview-panel" aria-labelledby="preview-heading"><div class="panel-heading"><h2 id="preview-heading">Mosaic preview</h2><span id="summary" class="summary">No image loaded</span></div><div id="preview" class="preview" aria-live="polite" aria-label="Generated photo mosaic preview"><p class="empty-state">Your mosaic will appear here.</p></div></section></div></main><footer class="site-footer"><p>Your image is processed only in this browser.</p></footer><script src="script.js"></script></body></html>
