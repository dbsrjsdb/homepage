<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Convert Unix timestamps and dates with relative time output."><title>UnixTimestampExplorer | Explore time</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="page-shell"><header class="hero"><p class="eyebrow">Time since the epoch</p><h1>Unix<span>TimestampExplorer</span></h1><p class="intro">Convert Unix timestamps and human dates, then see exactly how far they are from now.</p></header><section class="panel explorer" aria-labelledby="explorer-heading"><div class="panel-heading"><h2 id="explorer-heading">Timestamp converter</h2><span id="timezone" class="summary"></span></div><div class="mode-tabs" role="group" aria-label="Conversion direction"><button class="mode active" data-mode="timestamp" type="button" aria-pressed="true">Timestamp → date</button><button class="mode" data-mode="date" type="button" aria-pressed="false">Date → timestamp</button></div><div id="timestamp-fields"><label for="timestamp-input">Unix timestamp</label><div class="input-row"><input id="timestamp-input" type="number" step="any" value="0"><select id="timestamp-unit" aria-label="Timestamp unit"><option value="s">Seconds</option><option value="ms">Milliseconds</option></select></div></div><div id="date-fields" hidden><label for="date-input">Date and time</label><input id="date-input" type="datetime-local"></div><div class="actions"><button id="now-button" type="button">Use current time</button><button id="reset-button" class="secondary-button" type="button">Reset</button></div><p id="status" class="status" role="status" aria-live="polite">Enter a value to begin.</p><div class="results" aria-live="polite"><div><span class="result-label">Unix seconds</span><output id="seconds-output">—</output></div><div><span class="result-label">Unix milliseconds</span><output id="milliseconds-output">—</output></div><div><span class="result-label">Local date</span><output id="local-output">—</output></div><div><span class="result-label">Relative time</span><output id="relative-output">—</output></div></div><button id="copy-button" class="copy-button" type="button">Copy results</button></section></main><footer class="site-footer"><p>Time calculations run entirely in this browser.</p></footer><script src="script.js"></script></body></html>
