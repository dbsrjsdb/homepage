<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Resize images locally in your browser and download the result." />
    <title>ImageResizer | Resize locally</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">Private in-browser utility</p>
        <h1>Image<span>Resizer</span></h1>
        <p class="intro">Change an image's dimensions or scale it by percentage, then download the resized result.</p>
      </header>

      <div class="workspace">
        <section class="panel input-panel" aria-labelledby="input-heading">
          <h2 id="input-heading">Choose an image</h2>
          <label class="drop-zone" id="drop-zone" for="file-input">
            <span class="drop-icon" aria-hidden="true">↕</span>
            <span class="drop-title">Drop an image here</span>
            <span class="drop-help">or choose an image from your device</span>
            <span class="browse-button">Browse image</span>
            <input id="file-input" type="file" accept="image/*" />
          </label>
          <p class="status" id="status" role="status" aria-live="polite">No image selected yet.</p>
          <button class="secondary-button" id="reset-button" type="button" disabled>Reset</button>
        </section>

        <section class="panel controls-panel" aria-labelledby="controls-heading">
          <h2 id="controls-heading">Resize settings</h2>
          <form id="resize-form">
            <fieldset>
              <legend>Resize by</legend>
              <div class="mode-tabs">
                <label><input type="radio" name="resize-mode" value="dimensions" checked /> Dimensions</label>
                <label><input type="radio" name="resize-mode" value="percentage" /> Percentage</label>
              </div>
            </fieldset>

            <div id="dimensions-controls" class="settings-group">
              <div class="field-grid">
                <div>
                  <label for="width-input">Width <span>(px)</span></label>
                  <input id="width-input" type="number" min="1" max="10000" step="1" disabled />
                </div>
                <div>
                  <label for="height-input">Height <span>(px)</span></label>
                  <input id="height-input" type="number" min="1" max="10000" step="1" disabled />
                </div>
              </div>
              <label class="check-label"><input id="lock-input" type="checkbox" checked disabled /> Keep aspect ratio</label>
            </div>

            <div id="percentage-controls" class="settings-group" hidden>
              <label for="percentage-input">Scale <span>(%)</span></label>
              <input id="percentage-input" type="number" min="1" max="1000" step="1" value="100" disabled />
            </div>

            <div class="format-row">
              <label for="format-input">Download format</label>
              <select id="format-input" disabled>
                <option value="image/png">PNG</option>
                <option value="image/jpeg">JPEG</option>
                <option value="image/webp">WebP</option>
              </select>
            </div>
            <button id="download-button" type="submit" disabled>Download resized image</button>
          </form>
        </section>

        <section class="panel preview-panel" aria-labelledby="preview-heading">
          <div class="panel-heading">
            <h2 id="preview-heading">Preview</h2>
            <span id="size-summary" class="size-summary">No image loaded</span>
          </div>
          <div class="preview" id="preview" aria-live="polite" aria-label="Resized image preview">
            <p class="empty-state">Your resized image will appear here.</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer"><p>Your image stays in this browser.</p></footer>
    <script src="script.js"></script>
  </body>
</html>
