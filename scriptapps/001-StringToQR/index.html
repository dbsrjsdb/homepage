<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Turn text into a downloadable QR code in your browser." />
    <title>StringToQR | Create a QR code</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">Private in-browser utility</p>
        <h1>String<span>ToQR</span></h1>
        <p class="intro">Turn a message, link, or any text into a QR code you can download.</p>
      </header>

      <div class="workspace">
        <section class="panel controls-panel" aria-labelledby="controls-heading">
          <h2 id="controls-heading">Configure your code</h2>
          <form id="qr-form">
            <label for="text-input">Text or URL</label>
            <textarea id="text-input" rows="7" placeholder="https://example.com or write a message..." required></textarea>
            <p id="status" class="status" role="status" aria-live="polite">Enter text to generate a QR code.</p>

            <div class="field-grid">
              <div>
                <label for="size-input">Pixel size</label>
                <select id="size-input">
                  <option value="128">128 px</option>
                  <option value="256" selected>256 px</option>
                  <option value="384">384 px</option>
                  <option value="512">512 px</option>
                </select>
              </div>
              <div>
                <label for="format-input">Image format</label>
                <select id="format-input">
                  <option value="png" selected>PNG</option>
                  <option value="jpeg">JPEG</option>
                </select>
              </div>
              <div>
                <label for="level-input">Error correction</label>
                <select id="level-input">
                  <option value="L">L · 7%</option>
                  <option value="M" selected>M · 15%</option>
                  <option value="Q">Q · 25%</option>
                  <option value="H">H · 30%</option>
                </select>
              </div>
            </div>

            <button type="submit">Generate QR code</button>
          </form>
        </section>

        <section class="panel preview-panel" aria-labelledby="preview-heading">
          <div class="panel-heading">
            <h2 id="preview-heading">Preview</h2>
            <span id="option-summary" class="option-summary">256 px · PNG · M</span>
          </div>
          <div id="qr-preview" class="qr-preview" aria-live="polite" aria-label="Generated QR code preview">
            <p class="empty-state">Your QR code will appear here.</p>
          </div>
          <button id="download-button" class="secondary-button" type="button" disabled>Download image</button>
        </section>
      </div>
    </main>

    <footer class="site-footer"><p>Your text is processed only in this browser.</p></footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
