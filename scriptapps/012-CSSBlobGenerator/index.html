<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Generate organic CSS and SVG blob shapes in your browser."><title>CSSBlobGenerator | Shape organic forms</title><link rel="stylesheet" href="styles.css"></head><body><main class="page-shell"><header class="hero"><p class="eyebrow">Soft geometry</p><h1>CSS<span>BlobGenerator</span></h1><p class="intro">Shape an organic blob, tune its character, and export a reusable SVG or CSS border-radius.</p></header><div class="workspace"><section class="panel controls-panel" aria-labelledby="controls-heading"><h2 id="controls-heading">Blob settings</h2><label for="points-input">Points <output id="points-value" for="points-input">8</output></label><input id="points-input" type="range" min="4" max="14" value="8"><label for="irregularity-input">Irregularity <output id="irregularity-value" for="irregularity-input">28%</output></label><input id="irregularity-input" type="range" min="0" max="55" value="28"><label for="rotation-input">Rotation <output id="rotation-value" for="rotation-input">0°</output></label><input id="rotation-input" type="range" min="0" max="360" value="0"><div class="field-grid"><div><label for="background-input">Background</label><input id="background-input" type="color" value="#f0e9ff"></div><div><label for="blob-input">Blob color</label><input id="blob-input" type="color" value="#805ad5"></div></div><div class="actions"><button id="copy-button" class="secondary-button" type="button">Copy CSS</button><button id="download-button" type="button">Download SVG</button></div><button id="reset-button" class="secondary-button" type="button">Reset</button><p class="status" id="status" role="status" aria-live="polite">Blob ready.</p></section><section class="panel preview-panel" aria-labelledby="preview-heading"><div class="panel-heading"><h2 id="preview-heading">Preview</h2><span id="summary" class="summary">8 points</span></div><div id="preview" class="preview" aria-label="Generated blob preview"></div><div class="code-block"><span>CSS border-radius</span><code id="css-output"></code></div></section></div></main><footer class="site-footer"><p>Blob geometry is generated entirely in this browser.</p></footer><script src="script.js"></script></body></html>
