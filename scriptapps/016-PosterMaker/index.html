<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create image posters with headlines and typography locally in your browser."><title>PosterMaker | Design locally</title><link rel="stylesheet" href="styles.css"></head><body><main class="page-shell"><header class="hero"><p class="eyebrow">A canvas for your message</p><h1>Poster<span>Maker</span></h1><p class="intro">Place a headline over an image, tune the type, and export a polished PNG poster.</p></header><div class="workspace"><section class="panel controls-panel" aria-labelledby="controls-heading"><h2 id="controls-heading">Poster settings</h2><label class="drop-zone" id="drop-zone" for="file-input"><span class="drop-title">Drop a background image</span><span class="drop-help">or choose a file</span><span class="browse-button">Browse image</span><input id="file-input" type="file" accept="image/*"></label><label for="headline-input">Headline</label><textarea id="headline-input" rows="3" placeholder="Your headline">MAKE IT MATTER</textarea><label for="font-input">Typeface</label><select id="font-input"><option value="Arial Black,Arial,sans-serif">Bold sans</option><option value="Georgia,serif">Editorial serif</option><option value="Impact,Arial,sans-serif">Impact</option><option value="monospace">Monospace</option></select><label for="size-input">Text size <output id="size-value" for="size-input">54 px</output></label><input id="size-input" type="range" min="24" max="100" value="54"><label for="align-input">Alignment</label><select id="align-input"><option value="left">Left</option><option value="center" selected>Center</option><option value="right">Right</option></select><div class="field-grid"><div><label for="text-color">Text color</label><input id="text-color" type="color" value="#ffffff"></div><div><label for="overlay-input">Overlay <output id="overlay-value" for="overlay-input">35%</output></label><input id="overlay-input" type="range" min="0" max="80" value="35"></div></div><div class="actions"><button id="download-button" type="button">Export PNG</button><button id="reset-button" class="secondary-button" type="button">Reset</button></div><p class="status" id="status" role="status" aria-live="polite">Design ready.</p></section><section class="panel preview-panel" aria-labelledby="preview-heading"><div class="panel-heading"><h2 id="preview-heading">Poster preview</h2><span id="summary" class="summary">600 × 800 px</span></div><div class="poster-wrap"><canvas id="poster-canvas" role="img" aria-label="Poster preview"></canvas></div></section></div></main><footer class="site-footer"><p>Your poster is rendered only in this browser.</p></footer><script src="script.js"></script></body></html>
