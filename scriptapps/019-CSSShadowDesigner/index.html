<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Design CSS box and text shadows with a live preview."><title>CSSShadowDesigner | Design shadows</title><link rel="stylesheet" href="styles.css"></head><body><main class="page-shell"><header class="hero"><p class="eyebrow">Depth, tuned precisely</p><h1>CSS<span>ShadowDesigner</span></h1><p class="intro">Shape a box or text shadow with live controls, then copy the CSS declaration for your project.</p></header><div class="workspace"><section class="panel controls-panel" aria-labelledby="controls-heading"><h2 id="controls-heading">Shadow settings</h2><label for="type-input">Shadow target</label><select id="type-input"><option value="box">Box shadow</option><option value="text">Text shadow</option></select><label for="x-input">Horizontal offset <output id="x-value" for="x-input">8 px</output></label><input id="x-input" type="range" min="-40" max="40" value="8"><label for="y-input">Vertical offset <output id="y-value" for="y-input">12 px</output></label><input id="y-input" type="range" min="-40" max="40" value="12"><label for="blur-input">Blur <output id="blur-value" for="blur-input">24 px</output></label><input id="blur-input" type="range" min="0" max="60" value="24"><div id="spread-row"><label for="spread-input">Spread <output id="spread-value" for="spread-input">0 px</output></label><input id="spread-input" type="range" min="-20" max="30" value="0"></div><div class="field-grid"><div><label for="shadow-color">Shadow color</label><input id="shadow-color" type="color" value="#18212b"></div><div><label for="background-color">Preview background</label><input id="background-color" type="color" value="#e9eef5"></div></div><label for="opacity-input">Opacity <output id="opacity-value" for="opacity-input">35%</output></label><input id="opacity-input" type="range" min="0" max="100" value="35"><div class="actions"><button
