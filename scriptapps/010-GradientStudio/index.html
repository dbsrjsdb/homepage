<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Build linear, radial, and conic CSS gradients visually." />
    <title>GradientStudio | Build CSS gradients</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">Color in motion</p>
        <h1>Gradient<span>Studio</span></h1>
        <p class="intro">Build a CSS gradient visually, tune every color stop, and copy the finished declaration.</p>
      </header>
      <div class="workspace">
        <section class="panel controls-panel" aria-labelledby="controls-heading">
          <h2 id="controls-heading">Gradient settings</h2>
          <label for="type-input">Gradient type</label>
          <select id="type-input"><option value="linear">Linear</option><option value="radial">Radial</option><option value="conic">Conic</option></select>
          <div id="angle-row"><label for="angle-input">Angle <output id="angle-value" for="angle-input">135°</output></label><input id="angle-input" type="range" min="0" max="360" value="135" /></div>
          <div class="stops-heading"><h3>Color stops</h3><button id="add-stop" class="small-button" type="button">+ Add stop</button></div>
          <div id="stops" class="stops" aria-live="polite"></div>
          <div class="actions"><button id="copy-button" class="secondary-button" type="button">Copy CSS</button><button id="download-button" type="button">Download CSS</button></div>
          <button id="reset-button" class="secondary-button" type="button">Reset</button>
          <p class="status" id="status" role="status" aria-live="polite">Gradient ready.</p>
        </section>
        <section class="panel preview-panel" aria-labelledby="preview-heading">
          <div class="panel-heading"><h2 id="preview-heading">Preview</h2><span id="stop-summary" class="summary">2 stops</span></div>
          <div id="gradient-preview" class="gradient-preview" aria-label="Live gradient preview"></div>
          <div class="code-block"><div class="code-heading"><span>CSS background</span><button id="copy-inline" class="small-button" type="button">Copy</button></div><code id="css-output"></code></div>
        </section>
      </div>
    </main>
    <footer class="site-footer"><p>CSS is generated entirely in this browser.</p></footer>
    <script src="script.js"></script>
  </body>
</html>
