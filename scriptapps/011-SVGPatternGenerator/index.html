<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Generate customizable geometric SVG patterns in your browser." />
    <title>SVGPatternGenerator | Build SVG backgrounds</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero"><p class="eyebrow">Repeatable geometry</p><h1>SVG<span>PatternGenerator</span></h1><p class="intro">Design a geometric background, preview it live, and export a clean standalone SVG.</p></header>
      <div class="workspace">
        <section class="panel controls-panel" aria-labelledby="controls-heading">
          <h2 id="controls-heading">Pattern settings</h2>
          <label for="pattern-input">Pattern style</label><select id="pattern-input"><option value="grid">Grid</option><option value="dots">Dots</option><option value="diagonal">Diagonal stripes</option><option value="diamonds">Diamonds</option></select>
          <div class="field-grid"><div><label for="background-input">Background</label><input id="background-input" type="color" value="#18212b" /></div><div><label for="shape-input">Shape</label><input id="shape-input" type="color" value="#78d5c5" /></div></div>
          <label for="size-input">Tile size <output id="size-value" for="size-input">48 px</output></label><input id="size-input" type="range" min="12" max="120" value="48" />
          <label for="stroke-input">Line weight <output id="stroke-value" for="stroke-input">2 px</output></label><input id="stroke-input" type="range" min="1" max="12" value="2" />
          <label for="rotation-input">Rotation <output id="rotation-value" for="rotation-input">0°</output></label><input id="rotation-input" type="range" min="0" max="360" value="0" />
          <label for="opacity-input">Shape opacity <output id="opacity-value" for="opacity-input">70%</output></label><input id="opacity-input" type="range" min="10" max="100" value="70" />
          <div class="actions"><button id="copy-button" class="secondary-button" type="button">Copy SVG</button><button id="download-button" type="button">Download SVG</button></div><button id="reset-button" class="secondary-button" type="button">Reset</button><p class="status" id="status" role="status" aria-live="polite">Pattern ready.</p>
        </section>
        <section class="panel preview-panel" aria-labelledby="preview-heading"><div class="panel-heading"><h2 id="preview-heading">Preview</h2><span id="summary" class="summary">48 px tile</span></div><div id="preview" class="preview" aria-label="Generated SVG pattern preview"></div><div class="code-block"><span>SVG markup</span><code id="svg-output"></code></div></section>
      </div>
    </main>
    <footer class="site-footer"><p>SVG is generated entirely in this browser.</p></footer><script src="script.js"></script>
  </body>
</html>
