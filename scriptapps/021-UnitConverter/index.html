<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Convert length, mass, temperature, speed, area, volume, and data units."><title>UnitConverter | Convert measurements</title><link rel="stylesheet" href="styles.css"></head><body><main class="page-shell"><header class="hero"><p class="eyebrow">Numbers, made useful</p><h1>Unit<span>Converter</span></h1><p class="intro">Convert everyday measurements across length, mass, temperature, speed, area, volume, and data.</p></header><section class="panel converter" aria-labelledby="converter-heading"><div class="panel-heading"><h2 id="converter-heading">Convert a value</h2><span id="category-summary" class="summary">Length</span></div><label for="category-input">Category</label><select id="category-input"></select><div class="conversion-grid"><div><label for="value-input">Value</label><input id="value-input" type="number" value="1" step="any" inputmode="decimal"></div><div><label for="from-input">From</label><select id="from-input"></select></div><div class="swap-cell"><button id="swap-button" class="swap-button" type="button" aria-label="Swap source and target units">⇄</button></div><div><label for="to-input">To</label><select id="to-input"></select></div></div><div class="result" aria-live="polite"><p class="result-label">Result</p><output id="result-output" for="value-input">0.621371 mi</output><p id="formula" class="formula"></p></div><button id="reset-button" class="secondary-button" type="button">Reset</button><p id="status" class="status" role="status" aria-live="polite">Ready to convert.</p></section></main><footer class="site-footer"><p>Conversions run entirely in this browser.</p></footer><script src="script.js"></script></body></html>
