<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Turn an image or emoji into favicon-sized PNG assets locally."><title>FaviconGenerator | Make icons locally</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="page-shell"><header class="hero"><p class="eyebrow">A tiny identity for your tab</p><h1>Favicon<span>Generator</span></h1><p class="intro">Turn an emoji or uploaded image into crisp favicon-sized PNG assets, entirely in your browser.</p></header><div class="workspace"><section class="panel controls-panel" aria-labelledby="controls-heading"><h2 id="controls-heading">Icon source</h2><div class="source-tabs" role="group" aria-label="Icon source"><button class="source-tab active" data-source="emoji" type="button" aria-pressed="true">Emoji</button><button class="source-tab" data-source="image" type="button" aria-pressed="false">Image</button></div><div id="emoji-controls"><label for="emoji-input">Emoji</label><input id="emoji-input" class="text-input" type="text" value="🌈" maxlength="4"><label for="emoji-bg">Background</label><input id="emoji-bg" type="color" value="#18212b"></div><div id="image-controls" hidden><label class="drop-zone" id="drop-zone" for="file-input"><span class="drop-title">Drop an image here</span><span class="drop-help">or choose a file</span><span class="browse-button">Browse image</span><input id="file-input" type="file" accept="image/*"></label></div><label for="radius-input">Corner radius <output id="radius-value" for="radius-input">20%</output></label><input id="radius-input" type="range" min="0" max="50" value="20"><div class="actions"><button id="download-all" type="button">Download PNGs</button><button id="reset-button" class="secondary-button" type="button">Reset</button></div><p class="status" id="status" role="status" aria-live="polite">Choose a source to begin.</p></section><section class="panel preview-panel" aria-labelledby="preview-heading"><div class="panel-heading"><h2 id="preview-heading">Favicon previews</h2><span id="summary" class="summary">4 sizes</span></div><div id="previews" class="previews" aria-live="polite"></div><div class="code-block"><span>HTML link tag</span><code id="html-output"></code></div></section></div></main><footer class="site-footer"><p>Your icon is generated only in this browser.</p></footer><script src="script.js"></script></body></html>
