<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search common HTTP status codes with local explanations and categories.">
  <title>HTTPStatusExplorer | Read the response</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero"><p class="eyebrow">A calmer way to read a response</p><h1>HTTP<span>StatusExplorer</span></h1><p class="intro">Search the status codes you meet in the wild, learn what they mean, and keep the useful distinctions close at hand.</p></header>
    <section class="panel" aria-labelledby="explorer-heading"><div class="panel-heading"><div><p class="section-kicker">Local reference</p><h2 id="explorer-heading">Find a status</h2></div><span id="result-count" class="summary">0 results</span></div>
      <div class="search-row"><label for="search">Search codes or explanations<input id="search" type="search" placeholder="Try 404, redirect, or server…" autocomplete="off"></label><label for="category">Category<select id="category"><option value="all">All categories</option><option value="1xx">1xx · Informational</option><option value="2xx">2xx · Success</option><option value="3xx">3xx · Redirection</option><option value="4xx">4xx · Client error</option><option value="5xx">5xx · Server error</option></select></label></div><p id="status" class="status" role="status" aria-live="polite">Search the built-in reference.</p><div id="status-list" class="status-list"></div>
    </section>
  </main>
  <footer class="site-footer"><p>A compact local reference for HTTP response codes.</p></footer>
  <script src="script.js"></script>
</body>
</html>
